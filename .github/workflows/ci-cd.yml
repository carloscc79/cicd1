name: Pipeline CI/CD Demo - GitHub Actions

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # FASE 1: INTEGRACIÓN CONTINUA (CI)
  # ==========================================
  code-quality-and-test:
    name: 1. Calidad de Código y Pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar entorno Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias de desarrollo
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Análisis estático de código (Linting)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  security-scan:
    name: 2. Escaneo de Vulnerabilidades (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Escaneo de vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

  build-and-push:
    name: 3. Construir y Publicar Imagen Docker
    needs: [code-quality-and-test, security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Autenticación en GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer Metadatos y Tags para Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Compilar y Publicar Imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ==========================================
  # FASE 2: DESPLIEGUE CONTINUO (CD)
  # ==========================================
  deploy-to-staging:
    name: 4. Despliegue con Ansible
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Llave SSH para Servidor Objetivo
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Instalar dependencias de Ansible
        run: |
          pip install ansible
          ansible-galaxy collection install community.docker

      - name: Ejecutar Playbook de Ansible (Despliegue Seguro)
        run: |
          ansible-playbook -i infra/ansible/inventory.ini infra/ansible/playbook.yml \
            -e "target_host=${{ secrets.APP_DOMAIN }}" \
            -e "ansible_port=${{ secrets.APP_PORT }}" \
            -e "image_tag=${{ github.sha }}" \
            -e "db_password=${{ secrets.DB_PASSWORD }}" \
            -e "registry_user=${{ github.actor }}" \
            -e "registry_token=${{ secrets.GITHUB_TOKEN }}"

  smoke-test:
    name: 5. Verificación POST-Despliegue (Smoke Test)
    needs: [deploy-to-staging]
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Llave SSH para Verificación Local
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Validar Endpoint de la Aplicación en Servidor
        run: |
          echo "Verificando disponibilidad del servicio vía SSH en el puerto 8080..."
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.APP_PORT }} carloscardozo@${{ secrets.APP_DOMAIN }} '
            for i in {1..6}; do
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
              if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 302 ]; then
                echo "El servicio respondió HTTP $HTTP_STATUS en localhost:8080. Despliegue Exitoso."
                exit 0
              fi
              echo "Intento $i: Estado HTTP $HTTP_STATUS. Esperando 5 segundos..."
              sleep 5
            done
            echo "ERROR: El servicio no respondió HTTP 200 a tiempo."
            exit 1
          '